log:
  level: error
api:
  http: '127.0.0.1:16581'
plugins:
  - tag: default_upstream
    type: forward
    args:
      upstreams:
        - tag: default_supplier
          addr: 'udp://127.0.0.1:53'
  - tag: main_entry
    type: sequence
    args:
      - exec: $default_upstream
  - tag: main_udp
    type: udp_server
    args:
      entry: main_entry
      listen: ':15353'
      enable_audit: false
  - tag: main_tcp
    type: tcp_server
    args:
      entry: main_entry
      listen: ':15353'
      enable_audit: false

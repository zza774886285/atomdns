name: Auto sync upstream release (patch-gated)

# 上游发出新的正式 release 时，全自动跑一遍：合并 → 编静态二进制 → 端到端验证回包源
# → 通过就发 VIP release 并推送 releases.json。目标机的 WebUI 随后提示可以更新，
# 由人决定什么时候点「立即更新」。
#
# 门禁顺序（任何一步失败都不发版，只开/更新 issue 通知）：
#   1. merge 上游 tag 进 vip-pktinfo，冲突即失败
#   2. pktinfo 单测
#   3. 编 musl 静态二进制，自报版本必须等于 tag
#   4. 端到端验证：发往 127.0.0.2 的回包源必须是 127.0.0.2（真二进制实际回包）
#
# 幂等：是否要同步以「releases.json 里有没有这个上游 tag」判定，不以 Cargo.toml
# 版本判定 —— 否则 merge 成功但构建失败时，版本已 bump，后面会一直 skip。

on:
  schedule:
    # 每小时一次；上游发版后最多一小时自动跟上
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '上游 tag（如 v0.6.4）。留空则自动探测最新正式 release'
        required: false
        type: string
      force:
        description: '已发布过也重建'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vip-pktinfo
          fetch-depth: 0

      - name: Detect the upstream release to follow
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            TAG="${INPUT_VERSION}"
          else
            # releases/latest 的 302 落地 URL 带 tag，不花 api.github.com 配额
            TAG="$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/jasonxtt/atomdns/releases/latest | sed -n 's|.*/tag/||p')"
          fi
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "探测到的 tag 不合法：${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          PUBLISHED="no"
          if [ -f releases.json ] && jq -e --arg t "${TAG}" 'any(.[]; .tag_name == $t)' releases.json >/dev/null; then
            PUBLISHED="yes"
          fi
          echo "published=${PUBLISHED}" >> "$GITHUB_OUTPUT"

          if [ "${PUBLISHED}" = "yes" ] && [ "${FORCE:-}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} 已经发过版，跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "需要同步并发版：${TAG}"
          fi

      - name: Merge the upstream tag
        if: steps.detect.outputs.skip == 'false'
        id: merge
        run: |
          set -euo pipefail
          TAG="${{ steps.detect.outputs.tag }}"
          git config user.name "atomdns-auto-sync"
          git config user.email "auto-sync@users.noreply.github.com"
          git remote add upstream https://github.com/jasonxtt/atomdns.git
          # 拉上游 tag 到自己命名空间，避免和我们的发布 tag 撞名
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/remotes/upstream-tags/${TAG}"
          UP="refs/remotes/upstream-tags/${TAG}"
          if git merge-base --is-ancestor "${UP}" HEAD; then
            echo "上游 ${TAG} 已是分支祖先，跳过合并"
            echo "merged=already" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit "${UP}"; then
            echo "merged=clean" >> "$GITHUB_OUTPUT"
          else
            echo "::error::merge ${TAG} 冲突（多半在 udp.rs / bind.rs），需要人工 rebase"
            git merge --abort 2>/dev/null || true
            echo "merged=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Set up Rust
        if: steps.detect.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        if: steps.detect.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: auto-sync-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: auto-sync-

      - name: Unit test (pktinfo)
        if: steps.detect.outputs.skip == 'false'
        run: cargo test --locked --manifest-path rust/Cargo.toml -p atomdns-native-host --lib pktinfo

      - name: Install zig (musl C cross compiler)
        if: steps.detect.outputs.skip == 'false'
        run: |
          python3 -m pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build static musl
        if: steps.detect.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.detect.outputs.tag }}
        run: |
          set -euo pipefail
          ATOMDNS_BUILD_VERSION="${VERSION}" cargo zigbuild --locked --release \
            --manifest-path rust/Cargo.toml --target x86_64-unknown-linux-musl -p atomdns-native-host
          BIN=rust/target/x86_64-unknown-linux-musl/release/atomdns
          file "${BIN}"
          REPORTED="$("${BIN}" version)"
          if [ "${REPORTED}" != "${VERSION}" ]; then
            echo "二进制自报版本 ${REPORTED} 与 ${VERSION} 不一致" >&2
            exit 1
          fi
          mkdir -p stage
          cp "${BIN}" stage/atomdns
          chmod 0755 stage/atomdns

      # 最硬的门禁：真二进制跑起来，看回包源地址对不对
      - name: End-to-end reply-source verification
        if: steps.detect.outputs.skip == 'false'
        run: python3 .github/ci/verify_reply_source.py --binary stage/atomdns

      - name: Build the WebUI package
        if: steps.detect.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.detect.outputs.tag }}
        run: |
          cd webui-log
          npm ci --include=dev
          UI_VERSION="${VERSION}" npm run build:package

      - name: Assemble the release assets
        if: steps.detect.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.detect.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          tar --format=ustar --owner=0 --group=0 --numeric-owner -czf out/atomdns-linux-amd64-musl.tar.gz -C stage atomdns
          cp out/atomdns-linux-amd64-musl.tar.gz out/atomdns-linux-amd64.tar.gz
          cp release/atomdns-webui.tar.gz out/atomdns-webui.tar.gz
          tar -xzOf out/atomdns-webui.tar.gz ui-manifest.json | jq -e --arg v "${VERSION}" '.ui_version == $v' >/dev/null

          sha() { sha256sum "$1" | awk '{print $1}'; }
          BIN_SHA="$(sha out/atomdns-linux-amd64.tar.gz)"
          MUSL_SHA="$(sha out/atomdns-linux-amd64-musl.tar.gz)"
          UI_SHA="$(sha out/atomdns-webui.tar.gz)"

          jq -n --arg v "${VERSION}" \
                --arg bin "${BIN_SHA}" --arg musl "${MUSL_SHA}" --arg ui "${UI_SHA}" \
            '{format: 1,
              channel: "rust",
              version: $v,
              required_config_schema: 0,
              config_package_id: "",
              artifacts: {
                "atomdns-linux-amd64.tar.gz":      {sha256: $bin},
                "atomdns-linux-amd64-musl.tar.gz": {sha256: $musl},
                "atomdns-webui.tar.gz":            {sha256: $ui}
              }}' > out/atomdns-update-manifest.json
          jq . out/atomdns-update-manifest.json

      - name: Publish the GitHub release
        if: steps.detect.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.detect.outputs.tag }}
          name: ${{ steps.detect.outputs.tag }}
          files: |
            out/atomdns-linux-amd64.tar.gz
            out/atomdns-linux-amd64-musl.tar.gz
            out/atomdns-webui.tar.gz
            out/atomdns-update-manifest.json
          body: |
            atomdns 补丁版 ${{ steps.detect.outputs.tag }}：UDP 回包源地址取收包目的地址（`IP_PKTINFO` / `IPV6_RECVPKTINFO`），可在 keepalived VIP 上正常应答。

            自动同步自上游 ${{ steps.detect.outputs.tag }}，已通过端到端回包源验证（发往 127.0.0.2 的回包源 = 127.0.0.2）。

            - 静态链接（musl），Debian 12/13 直接跑
            - 清单 `required_config_schema: 0`，纯二进制更新，不碰 `config_custom.yaml`
            - 上游 commit：${{ github.sha }}
            - 装完务必用 `dig @<VIP>` 确认回包源是 VIP

      - name: Update releases.json
        if: steps.detect.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.detect.outputs.tag }}
        run: |
          set -euo pipefail
          BASE="https://github.com/zza774886285/atomdns/releases/download/${VERSION}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BIN_SHA="$(jq -r '.artifacts["atomdns-linux-amd64.tar.gz"].sha256' out/atomdns-update-manifest.json)"
          MUSL_SHA="$(jq -r '.artifacts["atomdns-linux-amd64-musl.tar.gz"].sha256' out/atomdns-update-manifest.json)"
          UI_SHA="$(jq -r '.artifacts["atomdns-webui.tar.gz"].sha256' out/atomdns-update-manifest.json)"

          entry="$(jq -n \
            --arg tag "${VERSION}" --arg base "${BASE}" --arg now "${NOW}" \
            --arg bin "${BIN_SHA}" --arg musl "${MUSL_SHA}" --arg ui "${UI_SHA}" '{
              tag_name: $tag,
              draft: false,
              prerelease: false,
              published_at: $now,
              assets: [
                {name: "atomdns-linux-amd64.tar.gz",      browser_download_url: ($base + "/atomdns-linux-amd64.tar.gz"),      updated_at: $now, digest: ("sha256:" + $bin)},
                {name: "atomdns-linux-amd64-musl.tar.gz", browser_download_url: ($base + "/atomdns-linux-amd64-musl.tar.gz"), updated_at: $now, digest: ("sha256:" + $musl)},
                {name: "atomdns-webui.tar.gz",            browser_download_url: ($base + "/atomdns-webui.tar.gz"),            updated_at: $now, digest: ("sha256:" + $ui)},
                {name: "atomdns-update-manifest.json",    browser_download_url: ($base + "/atomdns-update-manifest.json"),    updated_at: $now}
              ]
            }')"

          if [ -f releases.json ]; then base_json="$(cat releases.json)"; else base_json='[]'; fi
          jq --argjson entry "${entry}" \
            '([$entry] + map(select(.tag_name != $entry.tag_name)))
             | sort_by(.published_at) | reverse | .[0:20]' <<<"${base_json}" > releases.json
          jq -r '.[].tag_name' releases.json

      # merge commit + releases.json 一次推，避免分支上留下「合并了但没发版」的中间态
      - name: Push branch and release index
        if: steps.detect.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.detect.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "atomdns-auto-sync"
          git config user.email "auto-sync@users.noreply.github.com"
          git add releases.json
          MERGED=no
          if git rev-parse -q --verify HEAD >/dev/null && \
             [ "$(git rev-list --count origin/vip-pktinfo..HEAD)" -gt 0 ]; then
            MERGED=yes
          fi
          if git diff --cached --quiet && [ "${MERGED}" = "no" ]; then
            echo "分支和索引都没有变化"
            exit 0
          fi
          if ! git diff --cached --quiet; then
            git commit -m "release: ${VERSION} in releases.json (auto sync)"
          fi
          git push origin HEAD:vip-pktinfo

      # 失败只开/更新一个 issue，不打断每天的提醒节奏
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.detect.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="上游自动同步失败：需要人工处理"
          BODY="$(printf '自动同步上游 `%s` 时失败，**没有发版**。\n\n运行记录：%s\n\n常见原因：\n- merge 冲突（`rust/native-host/src/udp.rs` / `bind.rs`）\n- pktinfo 单测失败\n- 端到端回包源验证失败（补丁被上游改动破坏）\n- 上游改动了 `webui-log` 构建\n\n处理完后手动跑一次本 workflow 即可（填上游 tag）。\n' "${TAG:-未知}" "${RUN_URL}")"
          NUM="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

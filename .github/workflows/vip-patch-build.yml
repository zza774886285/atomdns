name: Build VIP source-address patch

# 套用 vip-patch/patches/0001-udp-reply-source-address.patch，编出静态 musl 二进制并发布到本仓库 Releases。
# 触发方式：
#   1) 每日本地时间 04:00 检查上游（jasonxtt/atomdns）是否有新 tag，没有已发布产物就编一个；
#   2) 手动 Run workflow，可指定上游 tag，留空取最新。
# 产物 tag 形如 vip-v0.6.1；补丁套不上时 workflow 直接失败，不会静默出个没补丁的包。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '上游 tag（如 v0.6.1），留空取最新'
        required: false
        default: ''
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: vip-patch-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPSTREAM_REPO: jasonxtt/atomdns
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析上游 tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="$(gh api "repos/${UPSTREAM_REPO}/tags?per_page=100" --jq '.[].name' \
                   | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          fi
          if [ -z "${TAG}" ]; then
            echo "!! 取不到上游 tag" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_tag=vip-${TAG}" >> "$GITHUB_OUTPUT"
          echo "解析到上游 tag: ${TAG}"

      - name: 检查是否已有该版本产物
        id: check
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "已存在 ${RELEASE_TAG}，跳过"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取上游代码
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 50 --branch "${TAG}" "https://github.com/${UPSTREAM_REPO}" upstream
          git -C upstream log --oneline -1

      - name: 套补丁
        if: steps.check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/vip-patch/patches/0001-udp-reply-source-address.patch"
          cd upstream
          if git apply --check "$PATCH" 2>/dev/null; then
            git apply "$PATCH"
            echo "补丁已应用"
          elif git apply --check --3way "$PATCH" 2>/dev/null; then
            git apply --3way "$PATCH"
            echo "补丁已 3way 应用"
          else
            echo "!! 补丁套不上：上游改动了收发路径，需要人工 rebase（udp.rs / bind.rs）" >&2
            git apply --check --verbose "$PATCH" 2>&1 || true
            exit 2
          fi
          git diff --stat

      - name: 安装 Rust
        if: steps.check.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: 编译静态二进制
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cd upstream/rust
          export ATOMDNS_BUILD_VERSION="vip-${TAG}"
          cargo build --release --target x86_64-unknown-linux-musl -p atomdns-native-host

      - name: 打包并自检
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp upstream/rust/target/x86_64-unknown-linux-musl/release/atomdns dist/atomdns
          file dist/atomdns
          ./dist/atomdns version
          ( cd dist && sha256sum atomdns > atomdns.sha256 )
          tar -C dist -czf "atomdns-linux-amd64-musl-${TAG}.tar.gz" atomdns atomdns.sha256
          cp vip-patch/patches/0001-udp-reply-source-address.patch "dist/0001-udp-reply-source-address.patch"
          ls -l dist *.tar.gz

      - name: 发布 Release
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          上游 [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) \`${TAG}\` + UDP 回包源地址补丁。

          - 产物：\`atomdns-linux-amd64-musl-${TAG}.tar.gz\`（静态链接，Debian 12+ 直接跑）
          - 补丁：\`0001-udp-reply-source-address.patch\`（附件里也有）
          - 校验：见包内 \`atomdns.sha256\`
          - 说明：见 [vip-patch/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/vip-patch/README.md)

          修的是 keepalived VIP 上 UDP 应答源地址不对被客户端丢弃的问题（v4/v6 都覆盖）。

          **别在 WebUI 点「立即更新」**，那会装回官方包把补丁冲掉。
          EOF
          gh release create "${RELEASE_TAG}" \
            "atomdns-linux-amd64-musl-${TAG}.tar.gz" \
            "dist/0001-udp-reply-source-address.patch" \
            --title "${TAG} + VIP source-address patch" \
            --notes-file notes.md \
            --repo "${GITHUB_REPOSITORY}"

name: Build VIP musl binary

# 只要 vip-pktinfo 分支有改动就重编静态 musl 二进制并发 Release。
# 产物名：atomdns-vip-<上游版本>-<commit>。用 Release 里的 tar.gz 部署。

on:
  push:
    branches: [vip-pktinfo]
    paths:
      - 'rust/**'
      - '.github/workflows/vip-musl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: vip-musl-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: vip-musl-

      # 回包源地址的行为由这个单测守住：wildcard 监听必须用收包目的地址回包
      - name: Unit test (reply source address)
        run: cargo test --locked --manifest-path rust/Cargo.toml -p atomdns-native-host --lib pktinfo

      # ring 的 C/asm 部分在 musl 目标上需要一个 musl C 编译器；上游也是用 zig 做
      # musl 交叉编译（scripts/build-rust-release.sh 的 amd64-musl 分支），这里保持一致。
      - name: Install zig (musl C cross compiler)
        run: |
          python3 -m pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build static musl
        run: |
          cargo zigbuild --locked --release --manifest-path rust/Cargo.toml \
            --target x86_64-unknown-linux-musl -p atomdns-native-host
          file rust/target/x86_64-unknown-linux-musl/release/atomdns

      - name: Package
        id: pack
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/native-host/Cargo.toml | head -1)"
          SHA="$(git rev-parse --short HEAD)"
          NAME="atomdns-vip-${VERSION}-${SHA}"
          mkdir -p "out/${NAME}"
          cp rust/target/x86_64-unknown-linux-musl/release/atomdns "out/${NAME}/"
          chmod +x "out/${NAME}/atomdns"
          "./out/${NAME}/atomdns" version || true
          tar -czf "out/${NAME}.tar.gz" -C "out/${NAME}" atomdns
          sha256sum "out/${NAME}.tar.gz" | tee "out/${NAME}.tar.gz.sha256"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.name }}
          name: ${{ steps.pack.outputs.name }}
          files: |
            out/*.tar.gz
            out/*.sha256
          body: |
            atomdns 补丁版：UDP 回包源地址取收包目的地址（`IP_PKTINFO` / `IPV6_RECVPKTINFO`），
            可在 keepalived VIP（如 10.1.1.141 / fe80::141）上正常应答。

            - 静态链接（musl），Debian 12/13 直接跑
            - 上游 commit：${{ github.sha }}
            - 部署后务必用 dig/探针确认回包源是 VIP，`check -c` 只验配置

# Bridge network (Docker Desktop, Unraid/NAS with its own network, or when 53 must be mapped).
# In bridge mode 127.0.0.1 inside the container is the container itself: change upstreams that
# point at a companion on the host (default configuration: 127.0.0.1:6666 / :1053) to the
# host's address or to a compose service name, or the queries answer SERVFAIL.
# Any extra listener you add to the configuration needs its own mapping (the default configuration
# listens only on 53 and the API port 9099).
services:
  atomdns:
    image: jasonxtt/atomdns:latest
    container_name: atomdns
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "9099:9099/tcp"
    volumes:
      - ./atomdns-data:/cus/atomdns
    # A companion on the Docker host:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

# Recommended on Linux: the container shares the host network, so the default configuration's
# companions on 127.0.0.1 (the proxy core's DNS on :6666 / :1053) are reachable, every
# listener of the configuration is published without a port list, and the query log sees the real
# client addresses. The default configuration listens only on 53 (DNS) and the API port 9099; both
# must be free on the host; if another service holds one, use the bridge file instead.
services:
  atomdns:
    image: jasonxtt/atomdns:latest
    container_name: atomdns
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./atomdns-data:/cus/atomdns
